<!DOCTYPE html>
<html lang="ko">
<head>s
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>학교 급식 조회 & AI 한줄평</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 pb-12">

  <!-- Header -->
  <header class="bg-emerald-600 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-utensils text-2xl text-emerald-200"></i>
        <h1 class="text-xl font-bold tracking-tight">오늘의 학교 급식 & AI 한줄평</h1>
      </div>
      <span class="text-xs bg-emerald-700 text-emerald-100 px-2.5 py-1 rounded-full border border-emerald-500">나이스 & Gemini AI</span>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-4xl mx-auto px-4 mt-6 space-y-6">

    <!-- Step 1: 학교 검색 카드 -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
      <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-school text-emerald-600"></i> 학교 찾기
      </h2>
      
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <!-- 교육청 선택 -->
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">시·도 교육청</label>
          <select id="officeCode" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            <option value="B10">서울특별시교육청</option>
            <option value="C10">부산광역시교육청</option>
            <option value="D10">대구광역시교육청</option>
            <option value="E10">인천광역시교육청</option>
            <option value="F10">광주광역시교육청</option>
            <option value="G10">대전광역시교육청</option>
            <option value="H10">울산광역시교육청</option>
            <option value="I10">세종특별자치시교육청</option>
            <option value="J10">경기도교육청</option>
            <option value="K10">강원특별자치도교육청</option>
            <option value="M10">충청북도교육청</option>
            <option value="N10">충청남도교육청</option>
            <option value="P10">전북특별자치도교육청</option>
            <option value="Q10">전라남도교육청</option>
            <option value="R10">경상북도교육청</option>
            <option value="S10">경상남도교육청</option>
            <option value="T10">제주특별자치도교육청</option>
          </select>
        </div>

        <!-- 학교명 입력 -->
        <div class="md:col-span-2">
          <label class="block text-xs font-semibold text-slate-500 mb-1">학교 이름</label>
          <div class="flex gap-2">
            <input type="text" id="schoolName" placeholder="예: 한국고등학교" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none" onkeypress="if(event.key==='Enter') searchSchool()" />
            <button onclick="searchSchool()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-5 py-2.5 rounded-lg text-sm whitespace-nowrap transition-colors flex items-center gap-1.5">
              <i class="fa-solid fa-magnifying-glass"></i> 검색
            </button>
          </div>
        </div>
      </div>

      <!-- 학교 검색 결과 목록 -->
      <div id="schoolList" class="mt-4 hidden space-y-2 max-h-40 overflow-y-auto border-t border-slate-100 pt-3">
        <!-- JS dynamic content -->
      </div>
    </section>

    <!-- Step 2: 날짜 선택 & 조회 -->
    <section id="dateSection" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 hidden">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <span id="selectedSchoolBadge" class="inline-block bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-bold px-3 py-1 rounded-full mb-1">
            학교 미선택
          </span>
          <h2 class="text-xl font-bold text-slate-800">급식 날짜 선택</h2>
        </div>

        <div class="flex items-center gap-2">
          <input type="date" id="mealDate" class="p-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
          <button onclick="fetchMealInfo()" class="bg-slate-800 hover:bg-slate-900 text-white font-medium px-4 py-2.5 rounded-lg text-sm transition-colors flex items-center gap-1.5">
            <i class="fa-solid fa-calendar-check"></i> 급식 조회
          </button>
        </div>
      </div>
    </section>

    <!-- Step 3: 급식 결과 & AI 한줄평 표시 -->
    <section id="resultSection" class="hidden space-y-6">
      
      <!-- AI 한줄평 카카오/인스타 카드 스타일 -->
      <div class="bg-gradient-to-r from-emerald-500 to-teal-600 rounded-2xl p-6 text-white shadow-md relative overflow-hidden">
        <div class="absolute -right-6 -bottom-6 opacity-10 text-9xl">
          <i class="fa-solid fa-robot"></i>
        </div>
        <div class="relative z-10">
          <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-2">
              <span class="bg-white/20 backdrop-blur-md text-white text-xs px-2.5 py-1 rounded-full font-medium">
                <i class="fa-solid fa-sparkles text-amber-300"></i> Gemini AI 급식평
              </span>
            </div>
            <button onclick="generateAiReview()" class="text-xs bg-white/20 hover:bg-white/30 transition text-white px-2.5 py-1 rounded-md flex items-center gap-1">
              <i class="fa-solid fa-rotate-right"></i> 다시 작성
            </button>
          </div>

          <!-- Loading State for AI -->
          <div id="aiLoading" class="hidden py-4 flex items-center gap-3">
            <div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
            <p class="text-sm font-medium animate-pulse">AI가 오늘의 급식을 맛보고 한줄평을 생각하는 중...</p>
          </div>

          <!-- AI Text Result -->
          <p id="aiReviewText" class="text-lg md:text-xl font-bold leading-relaxed mt-2 text-emerald-50">
            급식을 조회하면 AI의 재치있는 한줄평이 작성됩니다!
          </p>
        </div>
      </div>

      <!-- 메뉴 상세 카드 -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
        <div class="flex items-center justify-between border-b border-slate-100 pb-4 mb-4">
          <h3 class="font-bold text-slate-800 text-lg flex items-center gap-2">
            <i class="fa-solid fa-bowl-food text-amber-500"></i> 메뉴 상세
          </h3>
          <span id="calorieBadge" class="text-xs font-semibold text-slate-500 bg-slate-100 px-3 py-1 rounded-full">
            - kcal
          </span>
        </div>

        <ul id="menuList" class="grid grid-cols-1 md:grid-cols-2 gap-3 text-sm text-slate-700">
          <!-- 메뉴 항목이 dynamic하게 들어감 -->
        </ul>

        <!-- 알레르기 및 정보 -->
        <div class="mt-6 pt-4 border-t border-slate-100 text-xs text-slate-400">
          * 메뉴에 표시된 숫자는 나이스 급식 알레르기 유발물질 번호입니다.
        </div>
      </div>

    </section>

    <!-- Alert / Empty Modal -->
    <div id="noDataAlert" class="hidden bg-amber-50 border border-amber-200 text-amber-800 rounded-2xl p-6 text-center">
      <i class="fa-solid fa-ghost text-3xl mb-2 text-amber-500"></i>
      <p class="font-bold">해당 날짜에는 급식 정보가 없습니다.</p>
      <p class="text-xs text-amber-600 mt-1">주말, 공휴일 또는 방학기간인지 확인해 보세요.</p>
    </div>

  </main>

  <!-- JavaScript Logic -->
  <script>
    /**
     * 환경변수 세팅 설정 안내:
     * 프로덕션 서버(Express, Vercel Serverless Function 등) 빌드 시 
     * process.env.GEMINI_API_KEY 값을 주입하여 사용할 수 있습니다.
     * 아래 예시는 클라이언트 단에서 환경 변수가 치환되거나 빈 값 처리되도록 구현되어 있습니다.
     */
    const apiKey = typeof process !== 'undefined' && process.env && process.env.GEMINI_API_KEY 
      ? process.env.GEMINI_API_KEY 
      : ""; // 서버 환경 변수에서 가져오며, 미설정 시 백엔드 릴레이 또는 기본 동작 처리

    // NICE Open API Endpoint (Key 없이도 사용 가능한 공공데이터 API)
    const NEIS_API_BASE = "https://open.neis.go.kr/hub";

    // Application State
    let selectedSchool = null;
    let currentMealData = null;

    // 페이지 로드 시 오늘 날짜 세팅
    window.onload = function() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('mealDate').value = today;
    };

    /**
     * 1. 나이스 학교 검색 API 호출
     */
    async function searchSchool() {
      const officeCode = document.getElementById('officeCode').value;
      const schoolName = document.getElementById('schoolName').value.trim();
      const schoolListContainer = document.getElementById('schoolList');

      if (!schoolName) {
        alert("학교 이름을 입력해주세요.");
        return;
      }

      schoolListContainer.innerHTML = '<p class="text-xs text-slate-400 py-2">학교 정보를 검색 중입니다...</p>';
      schoolListContainer.classList.remove('hidden');

      try {
        const url = `${NEIS_API_BASE}/schoolInfo?Type=json&pIndex=1&pSize=10&ATPT_OFCDC_SC_CODE=${officeCode}&SCHUL_NM=${encodeURIComponent(schoolName)}`;
        const response = await fetch(url);
        const data = await response.json();

        if (data.schoolInfo) {
          const schools = data.schoolInfo[1].row;
          renderSchoolList(schools, officeCode);
        } else {
          schoolListContainer.innerHTML = '<p class="text-xs text-rose-500 py-2">검색 결과가 없습니다. 학교 이름을 정확히 입력해주세요.</p>';
        }
      } catch (error) {
        console.error("학교 검색 오류:", error);
        schoolListContainer.innerHTML = '<p class="text-xs text-rose-500 py-2">학교 정보를 불러오는 중 오류가 발생했습니다.</p>';
      }
    }

    /**
     * 학교 검색 결과 UI 렌더링
     */
    function renderSchoolList(schools, officeCode) {
      const schoolListContainer = document.getElementById('schoolList');
      schoolListContainer.innerHTML = '';

      schools.forEach(school => {
        const item = document.createElement('div');
        item.className = "flex items-center justify-between p-2.5 hover:bg-slate-100 rounded-lg cursor-pointer transition text-sm border-b border-slate-50 last:border-0";
        item.innerHTML = `
          <div>
            <span class="font-bold text-slate-800">${school.SCHUL_NM}</span>
            <span class="text-xs text-slate-400 ml-2">${school.ORG_RDNMA || school.LCTN_SC_NM}</span>
          </div>
          <span class="text-xs bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded font-medium">선택</span>
        `;
        item.onclick = () => selectSchool(school, officeCode);
        schoolListContainer.appendChild(item);
      });
    }

    /**
     * 학교 선택
     */
    function selectSchool(school, officeCode) {
      selectedSchool = {
        officeCode: officeCode,
        code: school.SD_SCHUL_CODE,
        name: school.SCHUL_NM
      };

      // UI 업데이트
      document.getElementById('schoolList').classList.add('hidden');
      document.getElementById('selectedSchoolBadge').innerText = selectedSchool.name;
      document.getElementById('dateSection').classList.remove('hidden');

      // 선택 후 자동 급식 조회
      fetchMealInfo();
    }

    /**
     * 2. 나이스 급식 정보 API 호출
     */
    async function fetchMealInfo() {
      if (!selectedSchool) return;

      const dateInput = document.getElementById('mealDate').value;
      if (!dateInput) {
        alert("날짜를 선택해주세요.");
        return;
      }

      const ymd = dateInput.replace(/-/g, ''); // YYYYMMDD 변환
      const resultSection = document.getElementById('resultSection');
      const noDataAlert = document.getElementById('noDataAlert');

      resultSection.classList.add('hidden');
      noDataAlert.classList.add('hidden');

      try {
        const url = `${NEIS_API_BASE}/mealServiceDietInfo?Type=json&ATPT_OFCDC_SC_CODE=${selectedSchool.officeCode}&SD_SCHUL_CODE=${selectedSchool.code}&MLSV_YMD=${ymd}`;
        const response = await fetch(url);
        const data = await response.json();

        if (data.mealServiceDietInfo) {
          const mealRow = data.mealServiceDietInfo[1].row[0];
          currentMealData = mealRow;
          renderMealDetail(mealRow);
          resultSection.classList.remove('hidden');
          
          // 급식 데이터를 성공적으로 가져오면 AI 한줄평 자동 생성
          generateAiReview();
        } else {
          noDataAlert.classList.remove('hidden');
        }
      } catch (error) {
        console.error("급식 데이터 조회 오류:", error);
        alert("급식 정보를 불러오는 중 오류가 발생했습니다.");
      }
    }

    /**
     * 급식 상세 정보 UI 렌더링
     */
    function renderMealDetail(meal) {
      const menuList = document.getElementById('menuList');
      const calorieBadge = document.getElementById('calorieBadge');

      calorieBadge.innerText = meal.CAL_INFO || '칼로리 정보 없음';

      // 나이스 API는 메뉴에 <br/> 태그로 구분되어 있음
      const rawMenu = meal.DDISH_NM.split('<br/>');
      menuList.innerHTML = '';

      rawMenu.forEach(item => {
        const cleanName = item.trim();
        if (cleanName) {
          const li = document.createElement('li');
          li.className = "flex items-center gap-2 bg-slate-50 p-2.5 rounded-lg border border-slate-100";
          li.innerHTML = `<i class="fa-solid fa-check text-emerald-500 text-xs"></i> <span>${cleanName}</span>`;
          menuList.appendChild(li);
        }
      });
    }

    /**
     * 3. Google Gemini API 호출 - AI 한줄평 생성 (Exponential Backoff 적용)
     */
    async function generateAiReview() {
      if (!currentMealData) return;

      const aiReviewText = document.getElementById('aiReviewText');
      const aiLoading = document.getElementById('aiLoading');

      aiReviewText.classList.add('hidden');
      aiLoading.classList.remove('hidden');

      // 원본 급식 메뉴에서 숫자/특수문자 제거하여 정제
      const cleanMenuList = currentMealData.DDISH_NM
        .replace(/<br\/>/g, ', ')
        .replace(/[0-9.()]/g, '')
        .trim();

      const schoolName = selectedSchool.name;
      const prompt = `학교 이름: "${schoolName}", 오늘의 급식 메뉴: "${cleanMenuList}". 
이 급식 메뉴를 보고 초/중/고등학생들이 좋아할 만한 재치있고 위트 있는 'AI 급식 한줄평'을 딱 한 문장(20자~40자 내외)으로 작성해줘. 친근하고 유쾌한 톤으로 말해줘. 이모지도 1-2개 써줘.`;

      const requestPayload = {
        contents: [
          {
            parts: [{ text: prompt }]
          }
        ],
        systemInstruction: {
          parts: [{ text: "너는 유쾌하고 위트 넘치는 학교 급식 평론가 AI야. 급식 메뉴를 보고 학생들의 마음을 사로잡을 한줄평을 작성해줘." }]
        }
      };

      // Exponential Backoff 재시도 로직 구현
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
      let attempts = 0;
      const maxRetries = 5;
      let success = false;
      let aiResponseText = "";

      while (attempts < maxRetries && !success) {
        try {
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(requestPayload)
          });

          if (response.ok) {
            const result = await response.json();
            aiResponseText = result.candidates?.[0]?.content?.parts?.[0]?.text;
            if (aiResponseText) {
              success = true;
              break;
            }
          }
        } catch (err) {
          // Silent catch for retry
        }

        attempts++;
        if (!success && attempts < maxRetries) {
          const delay = Math.pow(2, attempts - 1) * 1000; // 1s, 2s, 4s, 8s, 16s
          await new Promise(resolve => setTimeout(resolve, delay));
        }
      }

      aiLoading.classList.add('hidden');
      aiReviewText.classList.remove('hidden');

      if (success && aiResponseText) {
        aiReviewText.innerText = aiResponseText.trim();
      } else {
        // 백엔드 환경변수 미설정 또는 실패 시 렌더링될 fallback 메시지
        aiReviewText.innerText = "🍱 " + cleanMenuList.split(',').slice(0, 3).join(', ') + " 조합이라니, 오늘 급식은 무조건 완밥 각입니다!";
      }
    }
  </script>
</body>
</html>
